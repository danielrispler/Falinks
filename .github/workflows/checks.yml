name: Workflow checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # Related-scope checks run the real pinned Go analyzer (#21).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - id: gopls
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gopls
          key: gopls-v0.22.0-go1.27-${{ runner.os }}-${{ runner.arch }}
      - if: steps.gopls.outputs.cache-hit != 'true'
        run: go install golang.org/x/tools/gopls@v0.22.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: |
            . -> target
            evaluation -> target
      # Repeated from the macos job (keep the versions in step): steps cannot be
      # shared across jobs without a composite action.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - id: gopls
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gopls
          key: gopls-v0.22.0-go1.27-${{ runner.os }}-${{ runner.arch }}
      - if: steps.gopls.outputs.cache-hit != 'true'
        run: go install golang.org/x/tools/gopls@v0.22.0
      # Contained commands need Landlock in the LSM list (docs/platforms.md).
      - run: grep -qw landlock /sys/kernel/security/lsm
      - run: cargo fmt --manifest-path evaluation/Cargo.toml --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The engine suite runs unchanged on Linux (#54).
      - run: cargo test --locked
      - run: cargo fetch --locked --manifest-path evaluation/Cargo.toml
      - run: cargo clippy --locked --offline --manifest-path evaluation/Cargo.toml --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories bans
          arguments: --locked
          rust-version: "1.99.0"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories bans
          arguments: --locked
          rust-version: "1.99.0"
          manifest-path: evaluation/Cargo.toml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image bundles shellcheck, so run: steps are linted too.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  probes:
    # Probe crates stay standalone (own [workspace] and Cargo.lock), so discover them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
      - run: |
          for probe in adapters/*/Cargo.toml; do
            grep -qx '\[workspace\]' "$probe" || continue
            echo "::group::$probe"
            cargo fmt --manifest-path "$probe" --check
            cargo clippy --locked --manifest-path "$probe" --all-targets -- -D warnings
            echo "::endgroup::"
          done
