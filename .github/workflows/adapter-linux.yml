name: Claude Code adapter on Linux

# Evidence for the Claude Code adapter's Linux cells in docs/platforms.md (#57, #115), not
# a required check.
#
# #236 spike branch: per-command confinement (falinks-claude-shell) replaces Claude Code's
# sandbox. Bubblewrap must still fail under the default AppArmor policy, and every control
# must pass under that same policy, with no user namespaces. Linux x86_64 only.
#
# Every run builds the adapter binaries and runs the worker-sandbox prerequisite check on
# both runners, with no model call: under the runner's default AppArmor policy, bubblewrap
# with a new network namespace must fail with `loopback: Failed RTM_NEWADDR`, and once
# unprivileged user namespaces are allowed it must succeed. Then the live adapter check
# runs check-claude-adapter with the pinned runtime under both policies: under the default
# policy the worker sandbox must fail closed, and with user namespaces every control must
# pass. A model refusal exits 2 and is red: inconclusive, never evidence either way.
#
# The live check logs in with the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`), the
# maintainer's own subscription: a run on both runners adds about 2 points to its 5-hour
# window. So pull requests never run it; "Live adapter checks" in
# docs/agents/ticket-authoring.md says when it runs.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    # A scheduled run goes ahead only when main has commits from the last 24 hours.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.commits.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: commits
        run: |
          if [[ $GITHUB_EVENT_NAME != schedule || -n $(git log --since='24 hours ago' --format=%H) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No commits on main in the last 24 hours; skipping the live adapter check."
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            claude: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CLAUDE: runtimes/claude/claude
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      # Claude Code's Linux sandbox needs both.
      - run: sudo apt-get install -y bubblewrap socat
      - run: cargo build --release --locked --bin check-claude-adapter --bin falinks-claude-tool --bin falinks-claude-shell --bin sandbox-probe
      # A deleted secret must fail the run, not silently stop the evidence.
      - name: Token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z $CLAUDE_CODE_OAUTH_TOKEN ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set; a $GITHUB_EVENT_NAME run must go live."
            exit 1
          fi
      # The adapter verifies it against PINS before running it.
      - name: Pinned runtime
        env:
          DIST: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases
        run: |
          version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' adapters/claude/lib.rs)
          if [[ -z $version ]]; then
            echo "::error::No 'pub const VERSION: &str = \"...\";' line in adapters/claude/lib.rs."
            exit 1
          fi
          mkdir -p runtimes/claude
          curl -fsSL -o "$CLAUDE" "$DIST/$version/${{ matrix.claude }}/claude"
          chmod +x "$CLAUDE"
      - name: Host
        run: |
          {
            uname -srm
            grep PRETTY_NAME /etc/os-release
            echo "lsm=$(cat /sys/kernel/security/lsm)"
            sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces
            bwrap --version
          } | tee host.txt
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor by default, so
      # the worker sandbox cannot start (docs/platforms.md, "Linux adapters").
      - name: Worker-sandbox prerequisite, default policy
        run: |
          if err=$(bwrap --unshare-net --ro-bind / / true 2>&1 >/dev/null); then
            echo "::error::bubblewrap ran under the default policy; docs/platforms.md says it fails there."
            exit 1
          fi
          echo "$err"
          if [[ $err != *"loopback: Failed RTM_NEWADDR"* ]]; then
            echo "::error::bubblewrap failed without 'loopback: Failed RTM_NEWADDR'; docs/platforms.md records that message."
            exit 1
          fi
      # Per-command confinement needs no user namespaces, so every control must pass here.
      - name: Live adapter check, default policy
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: target/release/check-claude-adapter --binary "$CLAUDE" --output claude-default.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: adapter-linux-${{ matrix.claude }}
          path: |
            host.txt
            claude-*.json
