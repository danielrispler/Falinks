name: Evaluation tests

# The evaluation crate is standalone (see evaluation/Cargo.toml), so its slow
# macOS tests run only when its inputs change. Lint and deny stay in checks.yml.
on:
  pull_request:
    paths: ["evaluation/**", "rust-toolchain.toml", ".cargo/**", ".github/workflows/evaluation.yml"]
  push:
    branches: [main]
    paths: ["evaluation/**", "rust-toolchain.toml", ".cargo/**", ".github/workflows/evaluation.yml"]

# A new push cancels its pull request's older run; every main commit runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with checks.yml.
  GO_VERSION: "1.27.2"

jobs:
  macos-evaluation:
    # Sandboxed Go/Cargo checks are slow and time out under contention, so each
    # shard runs serially on its own runner. Shards are balanced by measured test
    # time; the last shard takes every other test, so keep its skips in step.
    # Four shards plus the checks.yml macos job fill the free plan's five
    # concurrent macOS runners; a fifth shard would queue.
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        tests:
          - batch_gates_pauses batch_tells_a_gate
          - fixture_shard_runs codex_bridge
          - frozen_oracles oracle_blocks baseline_exchanges
          - --skip batch_gates_pauses --skip batch_tells_a_gate --skip fixture_shard_runs --skip codex_bridge --skip frozen_oracles --skip oracle_blocks --skip baseline_exchanges
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-workspaces: evaluation -> target
      # As in checks.yml: restoring the tool cache beats setup-go's own copy.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/go/${{ env.GO_VERSION }}
          key: go-${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: cargo fetch --locked --manifest-path evaluation/Cargo.toml
      - run: cargo test --locked --offline --manifest-path evaluation/Cargo.toml -- --test-threads=1 ${{ matrix.tests }}
