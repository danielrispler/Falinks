name: Evaluation tests

# The evaluation crate is standalone (see evaluation/Cargo.toml), so its slow
# macOS tests run only when its inputs change. Lint and deny stay in checks.yml.
on:
  pull_request:
    paths: ["evaluation/**", "rust-toolchain.toml", ".cargo/**", ".github/workflows/evaluation.yml"]
  push:
    branches: [main]
    paths: ["evaluation/**", "rust-toolchain.toml", ".cargo/**", ".github/workflows/evaluation.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-evaluation:
    # Sandboxed Go/Cargo checks are slow and time out under contention, so each
    # shard runs serially on its own runner. The last shard takes every other test.
    runs-on: macos-latest
    strategy:
      matrix:
        tests:
          - frozen_oracles
          - oracle_blocks oracles_reject_compiling
          - --skip frozen_oracles --skip oracle_blocks --skip oracles_reject_compiling
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: evaluation -> target
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: cargo fetch --locked --manifest-path evaluation/Cargo.toml
      - run: cargo test --locked --offline --manifest-path evaluation/Cargo.toml -- --test-threads=1 ${{ matrix.tests }}
