name: Evaluation tests

# The evaluation crate is standalone (see evaluation/Cargo.toml), so its slow
# macOS and Linux tests run only when its inputs change. Lint and deny stay in checks.yml.
# Pull requests only: a PR that changes these inputs waits for this run before merge
# (AGENTS.md, "Checks"; no required check enforces it), so main does not repeat it
# and hold four macOS runners.
on:
  pull_request:
    paths: ["evaluation/**", "rust-toolchain.toml", ".cargo/**", ".github/workflows/evaluation.yml"]

# A new push cancels its pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with checks.yml.
  GO_VERSION: "1.27.2"

jobs:
  evaluation:
    # Sandboxed Go/Cargo checks are slow and time out under contention, so each
    # shard runs serially on its own runner. Shards are balanced by each test's
    # worst time in runs 39766522074 and 39764928341; the last shard takes every
    # other test, so keep its skips in step.
    # Four shards plus the checks.yml macos job fill the free plan's five
    # concurrent macOS runners; a fifth shard would queue. Linux runners have their
    # own quota, so the same shards run there on the Landlock backend (#56).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        tests:
          - frozen_oracles baseline_retains fixture_shard_runs
          - nested_agents_invalidate two_agent_runs
          - oracle_blocks track_t_batch usage_is_complete
          - --skip frozen_oracles --skip baseline_retains --skip fixture_shard_runs --skip nested_agents_invalidate --skip two_agent_runs --skip oracle_blocks --skip track_t_batch --skip usage_is_complete
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-workspaces: evaluation -> target
      # As in checks.yml: restoring the tool cache beats setup-go's own copy.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/go/${{ env.GO_VERSION }}
          key: go-${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # The Linux sandbox needs Landlock in the LSM list (docs/platforms.md).
      - if: runner.os == 'Linux'
        run: grep -qw landlock /sys/kernel/security/lsm
      - run: cargo fetch --locked --manifest-path evaluation/Cargo.toml
      - run: cargo test --locked --offline --manifest-path evaluation/Cargo.toml -- --test-threads=1 ${{ matrix.tests }}
