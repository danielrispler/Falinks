name: Bug report
description: Something in Falinks behaves wrongly.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest steps or repository that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS aarch64
        - macOS x86_64
        - Linux x86_64
        - Linux aarch64
        - Other
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Engine
        - Claude Code adapter
        - Evaluation harness
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Falinks commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or incident evidence
      description: Error output, or the retained incident record. Remove secrets first.
      render: text
