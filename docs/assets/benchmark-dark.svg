<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Tokens per task: Falinks uses 96k, 101k and 122k tokens; Git worktrees plus merge use 168k, 184k and 231k">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="330" rx="16" fill="#0d1117" stroke="#30363d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="24" y="24" width="14" height="14" rx="3" fill="url(#g)"/>
    <text x="46" y="36" font-size="14" font-weight="600" fill="#f8fafc">Falinks</text>
    <rect x="124" y="24" width="14" height="14" rx="3" fill="#475569"/>
    <text x="146" y="36" font-size="14" font-weight="600" fill="#f8fafc">Git worktrees + merge</text>
    <text x="976" y="36" font-size="14" text-anchor="end" fill="#94a3b8">Tokens per task, lower is better</text>

    <text x="24" y="88" font-size="15" font-weight="700" fill="#f8fafc">Rust: structured errors across a crate</text>
    <rect x="24" y="98" width="326" height="20" rx="4" fill="url(#g)"/>
    <text x="358" y="113" font-size="14" font-weight="700" fill="#fb923c">96k</text>
    <rect x="24" y="122" width="571" height="20" rx="4" fill="#475569"/>
    <text x="603" y="137" font-size="14" fill="#94a3b8">168k · 1.75×</text>

    <text x="24" y="170" font-size="15" font-weight="700" fill="#f8fafc">Go: filtering + pagination, one handler</text>
    <rect x="24" y="180" width="343" height="20" rx="4" fill="url(#g)"/>
    <text x="375" y="195" font-size="14" font-weight="700" fill="#fb923c">101k</text>
    <rect x="24" y="204" width="626" height="20" rx="4" fill="#475569"/>
    <text x="658" y="219" font-size="14" fill="#94a3b8">184k · 1.82×</text>

    <text x="24" y="252" font-size="15" font-weight="700" fill="#f8fafc">Go: contract change mid-task</text>
    <rect x="24" y="262" width="415" height="20" rx="4" fill="url(#g)"/>
    <text x="447" y="277" font-size="14" font-weight="700" fill="#fb923c">122k</text>
    <rect x="24" y="286" width="785" height="20" rx="4" fill="#475569"/>
    <text x="817" y="301" font-size="14" fill="#94a3b8">231k · 1.89×</text>
  </g>
</svg>
