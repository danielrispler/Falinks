[package]
name = "sandbox-backends-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Throwaway research probe for issue #34; not a production sandbox backend"

# Standalone: research code stays outside the engine workspace.
[workspace]

[[bin]]
name = "sandbox-backends-probe"
path = "main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
