[package]
name = "claude-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Throwaway research probe for issue #32; not a production adapter"

# Standalone: research code stays outside the engine workspace.
[workspace]

[[bin]]
name = "claude-probe"
path = "main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
