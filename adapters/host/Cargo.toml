[package]
name = "falinks-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "sandbox-probe"
path = "sandbox_probe.rs"

[[bin]]
name = "wayfinder-startup"
path = "../../scripts/wayfinder_startup.rs"

[lints]
workspace = true

[dependencies]
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
