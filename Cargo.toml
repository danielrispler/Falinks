[package]
name = "falinks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace]
members = ["adapters/codex"]
default-members = [".", "adapters/codex"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
