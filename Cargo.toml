[package]
name = "falinks"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Many coding agents, one live repo: dependency-aware edits and exact, tested publication"
repository = "https://github.com/danielrispler/Falinks"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace]
members = ["adapters/codex", "adapters/claude", "scripts"]
default-members = [".", "adapters/codex", "adapters/claude", "scripts"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
