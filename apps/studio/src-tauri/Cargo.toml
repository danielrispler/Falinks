[package]
name = "studio"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
studio-core = { path = "../core" }
studio-hook = { path = "../hook" }
studio-understanding = { path = "../understanding" }
studio-terminal-daemon = { path = "../terminal-daemon" }
studio-workbench = { path = "../workbench" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
