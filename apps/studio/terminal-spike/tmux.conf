# Spike for #322: the tmux backend's settings. Loaded with -f on a private socket (-L studio-spike), so Daniel's own
# ~/.tmux.conf and tmux server stay out of it.
set -g status off
set -g mouse on
set -g history-limit 50000
set -g remain-on-exit on
set -s escape-time 0
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB:extkeys:clipboard:hyperlinks'
set -s extended-keys on
set -g set-clipboard on
set -g allow-passthrough on
