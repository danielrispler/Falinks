<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Studio</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <div class="app">
    <nav class="list" aria-label="Sessions">
      <p id="no-sessions" class="empty">No session yet.</p>
      <div id="groups"></div>
    </nav>
    <main class="pane">
      <p id="notice" role="status" hidden></p>
      <p id="empty" class="empty">Pick a session on the left.</p>
      <section id="view" hidden>
        <p id="session" class="session"></p>
        <p id="state" class="state"></p>
        <p id="step" class="step"><span id="tool" class="tool"></span> <code id="detail"></code></p>
        <section id="brief" class="brief" dir="rtl" lang="he" hidden></section>
        <h1 id="recent-title" class="cards-title" hidden>Last 30 minutes</h1>
        <section id="recent"></section>
        <h1 id="older-title" class="cards-title" hidden>Older</h1>
        <section id="older"></section>
        <h1 id="questions-title" class="cards-title" hidden>Questions</h1>
        <section id="questions"></section>
        <div class="own">
        <h1 id="checks-title" class="cards-title" hidden>Checks</h1>
        <ul id="checks" class="checks"></ul>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
