<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Studio</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-unicode11.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body data-layout="full">
  <!-- The grid runs right to left: the list on the right, the terminal in the centre, the rail on the left. -->
  <div class="app">
    <header class="top">
      <!-- Identity: the selected session's name; naming and the context share fill it (#480). -->
      <span id="identity" class="identity"></span>
      <span class="sp"></span>
      <!-- Usage: context, 5h and week (#480, #481). -->
      <span id="usage" class="usage"></span>
      <button id="rail-toggle" type="button" hidden>Story ⌘2</button>
    </header>

    <nav class="list" aria-label="Sessions">
      <div class="full">
        <p id="no-sessions" class="empty">No session yet.</p>
        <div id="groups"></div>
      </div>
      <div id="strip" class="strip"></div>
    </nav>

    <!-- The terminal pane (#466) draws into #terminal-body. -->
    <section id="terminal" class="term" aria-label="Terminal">
      <div class="term-h"><span id="terminal-title">terminal</span><span id="size" class="mono"></span></div>
      <div id="terminal-body" class="term-body"></div>
    </section>

    <aside class="rail" aria-label="Session story">
      <div class="rail-h">
        <!-- Times (#473), then the phases and the estimate (#475). -->
        <div id="times" class="times"></div>
        <div class="tools">
          <button id="open-all" class="tool" type="button">Open all</button>
          <button id="close-all" class="tool" type="button">Close all</button>
          <button id="wide" class="tool" type="button">Read wide</button>
        </div>
      </div>
      <div id="story" class="story">
        <p id="notice" role="status" hidden></p>
        <p id="empty" class="empty">Pick a session in the list.</p>
        <section id="view" hidden>
          <p id="state" class="state"></p>
          <!-- Decision history (#479), a collapsed section above the turns. -->
          <div id="decisions" class="decisions"></div>
          <!-- The intention and step line (#472). -->
          <div id="intention" class="intention"></div>
          <p id="step" class="step"><span id="tool" class="tool-name"></span> <code id="detail"></code></p>
          <section id="brief" class="brief" dir="rtl" lang="he" hidden></section>
          <h1 id="recent-title" class="cards-title" hidden>Last 30 minutes</h1>
          <section id="recent"></section>
          <h1 id="older-title" class="cards-title" hidden>Older</h1>
          <section id="older"></section>
          <h1 id="questions-title" class="cards-title" hidden>Questions</h1>
          <section id="questions"></section>
          <div class="own">
            <h1 id="checks-title" class="cards-title" hidden>Checks</h1>
            <ul id="checks" class="checks"></ul>
          </div>
        </section>
      </div>
      <!-- The open question, docked under the story. -->
      <div id="dock" class="dock" hidden></div>
    </aside>
  </div>
  <span id="probe" aria-hidden="true">MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM</span>
</body>
</html>
